spring:
  application:
    name: chain-ingest

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:risk}
    username: ${DB_USER:risk}
    password: ${DB_PASSWORD:risk}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: chain

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: chain
    liquibase-schema: chain

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: chain-ingest
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.riskscoring.common.event,com.riskscoring.common.model
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all

chain-ingest:
  cache-ttl: 6h
  max-counterparties: 25
  hop2-expand-top: 3
  hop2-reserve: 5
  max-token-balances: 10
  max-token-transfers: 25
  moralis:
    base-url: ${MORALIS_BASE_URL:https://deep-index.moralis.io/api/v2.2}
    api-key: ${MORALIS_API_KEY}
    page-size: 100
    max-hops: 2
    calls-per-second: 3
    rate-limit-retries: 4
    rate-limit-backoff: 1s
    connect-timeout: 10s
    read-timeout: 30s
  mempool:
    base-url: ${MEMPOOL_BASE_URL:https://mempool.space/api}
    max-hops: 1
    calls-per-second: 2
    rate-limit-retries: 4
    rate-limit-backoff: 2s
    connect-timeout: 10s
    read-timeout: 30s
  tron-grid:
    base-url: ${TRONGRID_BASE_URL:https://api.trongrid.io}
    api-key: ${TRONGRID_API_KEY:}
    page-size: 200
    max-hops: 2
    calls-per-second: 5
    rate-limit-retries: 4
    rate-limit-backoff: 2s
    connect-timeout: 10s
    read-timeout: 30s
  ton-api:
    base-url: ${TONAPI_BASE_URL:https://tonapi.io}
    api-key: ${TONAPI_API_KEY:}
    page-size: 100
    max-hops: 2
    calls-per-second: 1
    rate-limit-retries: 4
    rate-limit-backoff: 2s
    connect-timeout: 10s
    read-timeout: 30s
  helius:
    base-url: ${HELIUS_BASE_URL:https://mainnet.helius-rpc.com}
    api-key: ${HELIUS_API_KEY}
    page-size: 100
    max-hops: 2
    calls-per-second: 2
    rate-limit-retries: 4
    rate-limit-backoff: 2s
    connect-timeout: 10s
    read-timeout: 30s

logging:
  level:
    com.riskscoring: DEBUG
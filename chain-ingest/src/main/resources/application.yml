spring:
  application:
    name: chain-ingest

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:risk}
    username: ${DB_USER:risk}
    password: ${DB_PASSWORD:risk}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: chain

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: chain
    liquibase-schema: chain

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: chain-ingest
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.riskscoring.common.event,com.riskscoring.common.model
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all

chain-ingest:
  cache-ttl: 6h
  max-counterparties: 25
  max-hops: 2
  hop2-expand-top: 3
  hop2-reserve: 5
  etherscan:
    base-url: ${ETHERSCAN_BASE_URL:https://api.etherscan.io/v2/api}
    api-key: ${ETHERSCAN_API_KEY}
    page-size: 100
    calls-per-second: 3
    rate-limit-retries: 4
    rate-limit-backoff: 1s
    connect-timeout: 10s
    read-timeout: 30s

logging:
  level:
    com.riskscoring: DEBUG
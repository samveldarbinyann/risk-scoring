databaseChangeLog:
  - changeSet:
      id: 005-seed-bitcoin-labels
      author: sam
      changes:
        - loadData:
            tableName: label
            file: db/changelog/data/labels-bitcoin.csv
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: UUID
              - column:
                  name: chain
                  type: STRING
              - column:
                  name: address
                  type: STRING
              - column:
                  name: category
                  type: STRING
              - column:
                  name: name
                  type: STRING
              - column:
                  name: source
                  type: STRING

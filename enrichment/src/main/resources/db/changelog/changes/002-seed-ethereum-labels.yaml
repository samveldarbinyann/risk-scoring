databaseChangeLog:
  - changeSet:
      id: 002-seed-ethereum-labels
      author: sam
      changes:
        - loadData:
            tableName: label
            file: db/changelog/data/labels-ethereum.csv
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: UUID
              - column:
                  name: chain_id
                  type: NUMERIC
              - column:
                  name: address
                  type: STRING
              - column:
                  name: category
                  type: STRING
              - column:
                  name: name
                  type: STRING
              - column:
                  name: source
                  type: STRING
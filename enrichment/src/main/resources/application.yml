spring:
  application:
    name: enrichment

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:risk}
    username: ${DB_USER:risk}
    password: ${DB_PASSWORD:risk}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: enrichment

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: enrichment
    liquibase-schema: enrichment

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: enrichment
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.riskscoring.common.event,com.riskscoring.common.model
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all

enrichment:
  fresh-wallet-days: 30
  round-amounts-percent-threshold: 50
  internal-fan-out-threshold: 5
  ofac:
    base-url: ${OFAC_SDN_BASE_URL:https://www.treasury.gov/ofac/downloads/sanctions/1.0/sdn_advanced.xml}
    sync-cron: ${OFAC_SDN_SYNC_CRON:0 0 3 * * *}
    connect-timeout: 10s
    read-timeout: 2m

logging:
  level:
    com.riskscoring: DEBUG
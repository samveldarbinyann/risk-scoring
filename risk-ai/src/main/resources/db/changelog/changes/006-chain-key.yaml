databaseChangeLog:
  - changeSet:
      id: 006-chain-key
      author: sam
      changes:
        - dropIndex:
            tableName: scan_report
            indexName: idx_scan_report_target_chain
        - addColumn:
            tableName: scan_report
            columns:
              - column:
                  name: chain
                  type: varchar(32)
        - sql:
            sql: >
              UPDATE riskai.scan_report SET chain = CASE chain_id
                WHEN 1        THEN 'ETHEREUM'
                WHEN 10       THEN 'OPTIMISM'
                WHEN 56       THEN 'BNB_SMART_CHAIN'
                WHEN 100      THEN 'GNOSIS'
                WHEN 137      THEN 'POLYGON'
                WHEN 8453     THEN 'BASE'
                WHEN 42161    THEN 'ARBITRUM_ONE'
                WHEN 43114    THEN 'AVALANCHE'
                WHEN 59144    THEN 'LINEA'
                WHEN 11155111 THEN 'SEPOLIA'
              END
              WHERE chain IS NULL
        - sql:
            sql: DELETE FROM riskai.scan_report WHERE chain IS NULL
        - sql:
            sql: >
              UPDATE riskai.scan_report
              SET evidence = (evidence - 'chainId'::text) || jsonb_build_object('chain', chain)
              WHERE jsonb_exists(evidence, 'chainId')
        - addNotNullConstraint:
            tableName: scan_report
            columnName: chain
            columnDataType: varchar(32)
        - dropColumn:
            tableName: scan_report
            columns:
              - column:
                  name: chain_id
        - createIndex:
            tableName: scan_report
            indexName: idx_scan_report_target_chain
            columns:
              - column:
                  name: target
              - column:
                  name: chain
        - modifyDataType:
            tableName: scan_report
            columnName: target
            newDataType: varchar(128)

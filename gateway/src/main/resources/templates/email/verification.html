<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <meta content="dark" name="color-scheme"/>
    <meta content="dark" name="supported-color-schemes"/>
    <title th:text="${title}">Verification code</title>
    <style>
        @media (max-width: 620px) {
            .card { width: 100% !important }
            .pad { padding: 32px 24px !important }
            .code { font-size: 32px !important; letter-spacing: 10px !important }
        }
    </style>
</head>
<body style="margin:0;padding:0;background:#0a0b0f;font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e6e8ee;">

<table bgcolor="#0a0b0f" border="0" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#0a0b0f;" width="100%">
    <tr>
        <td align="center" style="padding:48px 20px;">

            <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin-bottom:20px;">
                <tr>
                    <td style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;color:#4c5163;letter-spacing:4px;text-transform:uppercase;">
                        RISK&nbsp;&middot;&nbsp;SCORING
                    </td>
                </tr>
            </table>

            <table bgcolor="#12141b" border="0" cellpadding="0" cellspacing="0" class="card" role="presentation"
                   style="width:560px;max-width:100%;background:#12141b;border:1px solid #262a36;border-radius:16px;"
                   width="560">
                <tr>
                    <td class="pad" style="padding:44px 48px;">
                        <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
                            <tr>
                                <td style="padding-bottom:10px;">
                                    <p style="margin:0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;color:#00e5c7;letter-spacing:2px;text-transform:uppercase;"
                                       th:text="${title}">Verification code</p>
                                </td>
                            </tr>
                            <tr>
                                <td style="padding-bottom:18px;">
                                    <h1 style="margin:0;font-size:24px;font-weight:600;color:#e6e8ee;line-height:1.3;letter-spacing:-0.4px;"
                                        th:text="${greeting}">Hi</h1>
                                </td>
                            </tr>
                            <tr>
                                <td style="padding-bottom:28px;">
                                    <p style="margin:0;font-size:15px;color:#8a90a2;line-height:1.7;"
                                       th:text="${intro}">Enter the code below to confirm your email address.</p>
                                </td>
                            </tr>
                            <tr>
                                <td align="center" bgcolor="#0a0b0f"
                                    style="background:#0a0b0f;border:1px solid #262a36;border-radius:12px;padding:28px 20px;">
                                    <p class="code"
                                       style="margin:0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:40px;font-weight:700;color:#e6e8ee;letter-spacing:14px;line-height:1;text-indent:14px;text-align:center;"
                                       th:text="${code}">000000</p>
                                </td>
                            </tr>
                            <tr>
                                <td align="center" style="padding-top:14px;">
                                    <p style="margin:0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:#4c5163;letter-spacing:1px;"
                                       th:text="${expiry}">Valid for 10 minutes</p>
                                </td>
                            </tr>
                            <tr>
                                <td style="padding-top:28px;border-top:1px solid #262a36;">
                                    <p style="margin:28px 0 0;font-size:13px;color:#8a90a2;line-height:1.7;"
                                       th:text="${security}">If you did not request this code, ignore this email.</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>

            <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin-top:24px;">
                <tr>
                    <td align="center">
                        <p style="margin:0;font-size:12px;color:#4c5163;line-height:1.6;"
                           th:text="${footer}">Automated message, please do not reply</p>
                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>

</body>
</html>

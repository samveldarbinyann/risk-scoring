docs.title=How AddressLens works
docs.subtitle=You submit one address. Everything after that is automatic: the system pulls on-chain data, cross-checks label lists, computes risk signals and asks an LLM to weigh them into a verdict.
docs.pipeline.title=Scan pipeline
docs.pipeline.body=A scan is not a single request. It is a chain of independent services passing events to each other, and you watch it happen live.
docs.pipeline.ingest.title=Chain ingest
docs.pipeline.ingest.body=Pulls transaction history, token transfers, balances and counterparties for the address, and builds a connection graph one to two hops deep.
docs.pipeline.enrich.title=Enrichment
docs.pipeline.enrich.body=Matches every address in that graph against sanctions, mixer and exchange label lists, then computes heuristic risk signals into an evidence bundle.
docs.pipeline.ai.title=AI reasoning
docs.pipeline.ai.body=An LLM receives the evidence bundle and only the evidence bundle. It weighs conflicting signals and returns a verdict, a score and an explanation naming the signals that decided it.
docs.pipeline.stream.title=Live stream
docs.pipeline.stream.body=Every stage reports progress over a WebSocket, so the scan console shows the work as it moves through the pipeline instead of a spinner.
docs.risk.title=Risk levels
docs.risk.body=Every scan ends in one of four levels plus a numeric score. The level is the LLM verdict over the evidence, not a threshold on a single metric.
docs.risk.LOW=Nothing suspicious found. Normal transaction patterns, no exposure to flagged addresses.
docs.risk.MEDIUM=Something is worth a look: unusual patterns or distant contact with flagged addresses, but no direct exposure.
docs.risk.HIGH=Strong indicators: significant mixer exposure or a short path to a flagged address. Treat funds from here as suspect.
docs.risk.CRITICAL=Direct exposure to a sanctioned address, or a combination of severe signals. Do not transact without legal review.
docs.signals.title=Signals we compute
docs.signals.body=Heuristics computed before the LLM ever sees the address. The model reasons over these; it does not invent them.
docs.signals.mixer=Share of funds that passed through a known mixer
docs.signals.sanctions=Distance in hops to the nearest flagged address
docs.signals.age=Age of the address and its transaction count
docs.signals.fanInOut=Fan-in and fan-out: how many counterparties send and receive
docs.signals.peelChain=Peel-chain pattern typical of laundering
docs.signals.freshDrained=Fresh wallet funded and drained shortly after
docs.signals.roundAmounts=Round amounts, unusual for organic activity
docs.flags.title=Sanctions are not mixers
docs.flags.body=Lumping these together produces false positives. We keep three label categories apart, and the difference is part of what the model reasons about.
docs.flags.sanctions.title=Sanctions
docs.flags.sanctions.body=Addresses on the OFAC SDN list. A hard flag: direct exposure is a legal matter, not a risk score.
docs.flags.mixers.title=Mixers
docs.flags.mixers.body=A curated list of mixing services. A soft flag. Tornado Cash was removed from the SDN list in March 2025 because immutable contracts cannot be sanctioned, but mixer exposure is still a laundering signal.
docs.flags.exchanges.title=Exchanges
docs.flags.exchanges.body=Known exchange hot wallets. Context rather than a flag, and usually lowers suspicion instead of raising it.
docs.api.title=API
docs.api.body=Programmatic access ships with any paid plan. Every call is counted against your monthly quota, one chain per scanned network.
docs.api.authTitle=Authentication
docs.api.authBody=Create a key under Settings and send it in the X-Api-Key header. The secret is shown once at creation and stored only as a hash.
docs.api.scanTitle=Request a scan
docs.api.scanBody=Returns a scan group id immediately. Scanning is asynchronous: poll the report endpoint or subscribe to the WebSocket stream.
docs.api.reportTitle=Fetch the report
docs.api.reportBody=Returns 409 while the scan is still running, and the full verdict with its explanation once it completes.
docs.api.quotaTitle=Quota
docs.api.quotaBody=One scanned network counts as one request. Passing four networks in a single call spends four units of quota.
docs.networks.title=Supported networks
docs.networks.body=Paste a target and we detect which networks its format belongs to. Omit the networks field and the scan fans out across every supported mainnet that matches.
docs.networks.statusLive=live
docs.networks.statusSoon=soon
docs.networks.roadmap=Bitcoin is live through mempool.space. Solana, TRON, TON and Sui are registered but not scannable yet: each needs its own on-chain data source and label lists.
docs.cta.title=Ready to start
docs.cta.body=Scanning from the landing page needs no account. An API key needs a plan.

docs.title=Как работает AddressLens
docs.subtitle=Вы отправляете один адрес. Дальше всё делает система: тянет ончейн-данные, кросс-чекает списки меток, считает риск-сигналы и отдаёт их LLM, чтобы та взвесила их в вердикт.
docs.pipeline.title=Конвейер скана
docs.pipeline.body=Скан — не один запрос. Это цепочка независимых сервисов, передающих друг другу события, и вы наблюдаете её вживую.
docs.pipeline.ingest.title=Сбор ончейн-данных
docs.pipeline.ingest.body=Тянет историю транзакций, токен-трансферы, балансы и контрагентов адреса и строит граф связей на один-два хопа.
docs.pipeline.enrich.title=Обогащение
docs.pipeline.enrich.body=Сверяет каждый адрес графа со списками санкций, миксеров и бирж, затем считает эвристические риск-сигналы и собирает пакет доказательств.
docs.pipeline.ai.title=Рассуждение AI
docs.pipeline.ai.body=LLM получает пакет доказательств и только его. Она взвешивает противоречивые сигналы и возвращает вердикт, скор и объяснение с указанием, какие именно сигналы решили исход.
docs.pipeline.stream.title=Живой стрим
docs.pipeline.stream.body=Каждая стадия отчитывается о прогрессе по WebSocket, поэтому консоль скана показывает реальную работу конвейера, а не спиннер.
docs.risk.title=Уровни риска
docs.risk.body=Каждый скан заканчивается одним из четырёх уровней и числовым скором. Уровень — это вердикт LLM по доказательствам, а не порог по одной метрике.
docs.risk.LOW=Подозрительного не найдено. Обычные паттерны транзакций, связей с флагнутыми адресами нет.
docs.risk.MEDIUM=Есть на что посмотреть: необычные паттерны или дальний контакт с флагнутыми адресами, но без прямой связи.
docs.risk.HIGH=Сильные индикаторы: заметная доля средств через миксер или короткий путь до флагнутого адреса. Средства отсюда считать подозрительными.
docs.risk.CRITICAL=Прямая связь с санкционным адресом или сочетание тяжёлых сигналов. Не проводить операции без юридической проверки.
docs.signals.title=Какие сигналы мы считаем
docs.signals.body=Эвристики считаются до того, как LLM вообще увидит адрес. Модель рассуждает над ними, а не выдумывает их.
docs.signals.mixer=Доля средств, прошедших через известный миксер
docs.signals.sanctions=Расстояние в хопах до ближайшего флагнутого адреса
docs.signals.age=Возраст адреса и число его транзакций
docs.signals.fanInOut=Fan-in и fan-out: сколько контрагентов шлёт и получает
docs.signals.peelChain=Паттерн peel-chain, характерный для отмывания
docs.signals.freshDrained=Свежий кошелёк, залитый и вскоре опустошённый
docs.signals.roundAmounts=Круглые суммы, нетипичные для органической активности
docs.flags.title=Миксер — не санкции
docs.flags.body=Валить их в одну кучу — плодить ложные срабатывания. Мы держим три категории меток раздельно, и эта разница — часть того, над чем рассуждает модель.
docs.flags.sanctions.title=Санкции
docs.flags.sanctions.body=Адреса из списка OFAC SDN. Жёсткий флаг: прямая связь — вопрос юридический, а не вопрос скора.
docs.flags.mixers.title=Миксеры
docs.flags.mixers.body=Курируемый список сервисов микширования. Мягкий флаг. Tornado Cash убран из SDN в марте 2025 года, потому что неизменяемые контракты нельзя заблокировать, но экспозиция к миксеру всё ещё сигнал отмывания.
docs.flags.exchanges.title=Биржи
docs.flags.exchanges.body=Известные hot-wallet бирж. Скорее контекст, чем флаг, и обычно снижает подозрительность, а не повышает.
docs.api.title=API
docs.api.body=Программный доступ идёт с любым платным тарифом. Каждый вызов списывается из месячной квоты — по единице на сканируемую сеть.
docs.api.authTitle=Аутентификация
docs.api.authBody=Создайте ключ в настройках и передавайте его в заголовке X-Api-Key. Секрет показывается один раз при создании и хранится только хешем.
docs.api.scanTitle=Запросить скан
docs.api.scanBody=Сразу возвращает id группы сканов. Сканирование асинхронное: опрашивайте эндпоинт отчёта или подпишитесь на WebSocket-стрим.
docs.api.reportTitle=Забрать отчёт
docs.api.reportBody=Пока скан идёт — возвращает 409, после завершения — полный вердикт с объяснением.
docs.api.quotaTitle=Квота
docs.api.quotaBody=Одна просканированная сеть — один запрос. Четыре сети в одном вызове списывают четыре единицы квоты.
docs.networks.title=Поддерживаемые сети
docs.networks.body=Вставьте объект — мы сами определим, каким сетям подходит его формат. Не передадите поле сетей — скан веером уйдёт по всем поддержанным мейннетам, подходящим под формат.
docs.networks.statusLive=готово
docs.networks.statusSoon=скоро
docs.cta.title=Готовы начать
docs.cta.body=Скан с главной страницы не требует аккаунта. API-ключ требует тарифа.
docs.cta.pricing=Посмотреть тарифы
docs.cta.contact=Задать вопрос
contact.title=Напишите нам
contact.subtitle=Вопросы по API, спорный вердикт по адресу или всё, на что не ответила документация.
contact.emailField=Ваша почта
contact.subjectField=Тема
contact.messageField=Сообщение
contact.submit=Отправить
contact.relatedScan=Связанный скан
contact.responseTime=Обычно отвечаем в течение двух рабочих дней.
contact.error=Не удалось отправить сообщение, попробуйте позже
contact.sentTitle=Сообщение отправлено
contact.sentBody=Мы получили ваше сообщение и ответим на указанный адрес.
contact.sendAnother=Написать ещё

contact.panel.eyebrow=Перед тем как написать
contact.panel.apiTitle=Вопрос по API
contact.panel.apiBody=Авторизация, эндпоинты, лимиты — большая часть уже есть в референсе.
contact.panel.verdictTitle=Спорный вердикт
contact.panel.verdictBody=Вставьте в сообщение адрес или ссылку на скан — так мы быстрее найдём его.
contact.panel.docsTitle=Что-то другое
contact.panel.docsBody=Конвейер, сигналы, уровни риска, источники меток — сначала загляните в документацию.
contact.panel.docsCta=Открыть документацию
contact.panel.responseTitle=Время ответа

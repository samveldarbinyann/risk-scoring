databaseChangeLog:
  - changeSet:
      id: 013-scan-group-user-id
      author: sam
      changes:
        - addColumn:
            tableName: scan_group
            columns:
              - column:
                  name: user_id
                  type: uuid
        - addForeignKeyConstraint:
            baseTableName: scan_group
            baseColumnNames: user_id

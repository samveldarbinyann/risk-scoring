databaseChangeLog:
  - changeSet:
      id: 004-create-email-verification-code
      author: sam
      changes:
        - createTable:
            tableName: email_verification_code
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_email_verification_code
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: code_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: purpose
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: timestamptz
              - column:
                  name: attempts
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: email_verification_code
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_email_code_user
            onDelete: CASCADE
        - createIndex:
            tableName: email_verification_code
            indexName: idx_email_code_user_purpose
            columns:
              - column:
                  name: user_id
              - column:
                  name: purpose
        - createIndex:
            tableName: email_verification_code
            indexName: idx_email_code_expires_at
            columns:
              - column:
                  name: expires_at

databaseChangeLog:
  - changeSet:
      id: 005-create-refresh-token
      author: sam
      changes:
        - createTable:
            tableName: refresh_token
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_refresh_token
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: issued_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: timestamptz
              - column:
                  name: user_agent
                  type: varchar(255)
              - column:
                  name: ip_address
                  type: varchar(45)
        - addForeignKeyConstraint:
            baseTableName: refresh_token
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_refresh_token_user
            onDelete: CASCADE
        - createIndex:
            tableName: refresh_token
            indexName: uq_refresh_token_hash
            unique: true
            columns:
              - column:
                  name: token_hash
        - createIndex:
            tableName: refresh_token
            indexName: idx_refresh_token_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: refresh_token
            indexName: idx_refresh_token_expires_at
            columns:
              - column:
                  name: expires_at

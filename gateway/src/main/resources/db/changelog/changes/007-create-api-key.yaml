databaseChangeLog:
  - changeSet:
      id: 007-create-api-key
      author: sam
      changes:
        - createTable:
            tableName: api_key
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_api_key
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: key_prefix
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: key_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: last_used_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: timestamptz
        - addForeignKeyConstraint:
            baseTableName: api_key
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_api_key_user
            onDelete: CASCADE
        - createIndex:
            tableName: api_key
            indexName: uq_api_key_hash
            unique: true
            columns:
              - column:
                  name: key_hash
        - createIndex:
            tableName: api_key
            indexName: idx_api_key_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: api_key
            indexName: idx_api_key_prefix
            columns:
              - column:
                  name: key_prefix

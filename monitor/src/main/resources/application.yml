spring:
  application:
    name: monitor

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:risk}
    username: ${DB_USER:risk}
    password: ${DB_PASSWORD:risk}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: monitor

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: monitor
    liquibase-schema: monitor

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: monitor
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.riskscoring.common.event,com.riskscoring.common.model
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all

monitor:
  recheck-interval: 6h
  scheduler-fixed-delay: 5m
  batch-size: 50
  stale-pending-timeout: 30m

logging:
  level:
    com.riskscoring: DEBUG

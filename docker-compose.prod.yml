name: risk-scoring

networks:
  risk-net:
    name: risk-scoring-net

volumes:
  kafka-data:
  postgres-data:
  caddy-data:
  caddy-config:

services:

  kafka:
    image: apache/kafka:latest
    container_name: risk-kafka
    restart: always
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,INTERNAL://kafka:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'risk-scoring-prod-cluster'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [risk-net]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17
    container_name: risk-postgres
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: risk
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [risk-net]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d risk"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: risk-kafka-ui
    restart: always
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: prod
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    networks: [risk-net]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  gateway:
    build: {context: ., dockerfile: Dockerfile, target: gateway}
    container_name: risk-gateway
    restart: always
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [risk-net]
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  chain-ingest:
    build: {context: ., dockerfile: Dockerfile, target: chain-ingest}
    container_name: risk-chain-ingest
    restart: always
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [risk-net]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /app/app.jar || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  enrichment:
    build: {context: ., dockerfile: Dockerfile, target: enrichment}
    container_name: risk-enrichment
    restart: always
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [risk-net]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /app/app.jar || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  risk-ai:
    build: {context: ., dockerfile: Dockerfile, target: risk-ai}
    container_name: risk-risk-ai
    restart: always
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [risk-net]
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /app/app.jar || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  monitor:
    build: {context: ., dockerfile: Dockerfile, target: monitor}
    container_name: risk-monitor
    restart: always
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [risk-net]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /app/app.jar || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  payment-watch:
    build: {context: ., dockerfile: Dockerfile, target: payment-watch}
    container_name: risk-payment-watch
    restart: always
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [risk-net]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /app/app.jar || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://addresslens.site
        VITE_WS_URL: wss://addresslens.site/ws
    container_name: risk-frontend
    restart: always
    networks: [risk-net]
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: risk-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway: {condition: service_healthy}
      frontend: {condition: service_healthy}
    networks: [risk-net]
    mem_limit: 128m
